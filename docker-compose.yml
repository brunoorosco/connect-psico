services:
  postgres:
    container_name: dev_database
    image: postgres
    environment:
      - POSTGRES_USER=developerdeck101
      - POSTGRES_PASSWORD=developerdeck101
    ports:
      - 5432:5432

  mongo:
    image: mongo:latest
    container_name: mongo-container
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
